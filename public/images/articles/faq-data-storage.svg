<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif"><rect width="640" height="430" fill="#ffffff"/><text x="320" y="48" text-anchor="middle" font-size="30" font-weight="800" fill="#0f172a">いいねと履歴の保存場所</text><text x="320" y="82" text-anchor="middle" font-size="19" fill="#64748b">名前やメールアドレスとは結びつきません</text><rect x="30" y="110" width="270" height="250" rx="18" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/><text x="165" y="150" text-anchor="middle" font-size="24" font-weight="800" fill="#9d174d">あなたのブラウザ</text><rect x="58" y="172" width="214" height="60" rx="12" fill="#ffffff" stroke="#fbcfe8"/><text x="165" y="202" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">履歴</text><text x="165" y="223" text-anchor="middle" font-size="15" fill="#64748b">ここだけに保存</text><rect x="58" y="248" width="214" height="60" rx="12" fill="#ffffff" stroke="#fbcfe8"/><text x="165" y="278" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">匿名ID</text><text x="165" y="299" text-anchor="middle" font-size="15" fill="#64748b">ランダムな文字列</text><text x="165" y="340" text-anchor="middle" font-size="15" fill="#9d174d">ブラウザごとに別のID</text><rect x="340" y="110" width="270" height="250" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="475" y="150" text-anchor="middle" font-size="24" font-weight="800" fill="#334155">サイトのサーバー</text><rect x="368" y="210" width="214" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="475" y="240" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">いいね</text><text x="475" y="261" text-anchor="middle" font-size="15" fill="#64748b">匿名IDにひもづけて保存</text><line x1="276" y1="278" x2="362" y2="244" stroke="#db2777" stroke-width="3"/><polygon points="364,236 368,250 352,246" fill="#db2777"/><text x="320" y="396" text-anchor="middle" font-size="18" fill="#475569">スマホとPCなど、端末を変えると別々になります</text></svg>
