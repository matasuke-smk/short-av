<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 600" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif"><rect width="440" height="600" fill="#ffffff"/><text x="220" y="44" text-anchor="middle" font-size="27" font-weight="800" fill="#0f172a">好みの作品の探し方</text><text x="220" y="76" text-anchor="middle" font-size="18" fill="#64748b">この順に行き来すると早く見つかる</text>
<rect x="40" y="100" width="360" height="80" rx="16" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/><circle cx="82" cy="140" r="22" fill="#db2777"/><text x="82" y="148" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">1</text><text x="118" y="134" font-size="22" font-weight="800" fill="#0f172a">ざっと流す</text><text x="118" y="162" font-size="16" fill="#475569">気になったらハートを付けて次へ</text>
<polygon points="210,190 230,190 220,206" fill="#f9a8d4"/>
<rect x="40" y="214" width="360" height="80" rx="16" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/><circle cx="82" cy="254" r="22" fill="#db2777"/><text x="82" y="262" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">2</text><text x="118" y="248" font-size="22" font-weight="800" fill="#0f172a">いいねを見返す</text><text x="118" y="276" font-size="16" fill="#475569">よく選ぶ女優やジャンルが分かる</text>
<polygon points="210,304 230,304 220,320" fill="#f9a8d4"/>
<rect x="40" y="328" width="360" height="80" rx="16" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/><circle cx="82" cy="368" r="22" fill="#db2777"/><text x="82" y="376" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">3</text><text x="118" y="362" font-size="22" font-weight="800" fill="#0f172a">絞り込む</text><text x="118" y="390" font-size="16" fill="#475569">ジャンルは1つずつ、女優からも</text>
<polygon points="210,418 230,418 220,434" fill="#f9a8d4"/>
<rect x="40" y="442" width="360" height="80" rx="16" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/><circle cx="82" cy="482" r="22" fill="#db2777"/><text x="82" y="490" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">4</text><text x="118" y="476" font-size="22" font-weight="800" fill="#0f172a">サンプルで確かめる</text><text x="118" y="504" font-size="16" fill="#475569">長いサンプルなら中身までわかる</text>
<text x="220" y="566" text-anchor="middle" font-size="17" fill="#64748b">迷った日は「人気」から始めるのも手</text></svg>
