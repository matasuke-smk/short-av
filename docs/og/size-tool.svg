<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="0.55" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="banana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- うっすら水玉 -->
  <g fill="#ffffff" opacity="0.18">
    <circle cx="90" cy="80" r="60"/><circle cx="1120" cy="90" r="80"/><circle cx="1040" cy="560" r="50"/><circle cx="200" cy="580" r="70"/><circle cx="620" cy="40" r="30"/>
  </g>

  <!-- バナナ（右側） -->
  <g transform="translate(720 60) rotate(-18 220 220)">
    <path d="M 60 300 Q 220 460 400 230" fill="none" stroke="#92400e" stroke-width="124" stroke-linecap="round"/>
    <path d="M 60 300 Q 220 460 400 230" fill="none" stroke="url(#banana)" stroke-width="104" stroke-linecap="round"/>
    <path d="M 95 300 Q 225 420 375 240" fill="none" stroke="#fef9c3" stroke-width="18" stroke-linecap="round" opacity="0.8"/>
    <circle cx="52" cy="306" r="24" fill="#78350f"/>
    <circle cx="410" cy="222" r="20" fill="#78350f"/>
    <g fill="#a16207" opacity="0.6">
      <circle cx="170" cy="365" r="7"/><circle cx="230" cy="392" r="5"/><circle cx="300" cy="355" r="6"/>
    </g>
  </g>

  <!-- メジャー -->
  <g transform="translate(790 455) rotate(-6)">
    <rect x="0" y="0" width="380" height="54" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="5"/>
    <g stroke="#1f2937" stroke-width="4">
      <line x1="30" y1="4" x2="30" y2="30"/><line x1="70" y1="4" x2="70" y2="18"/><line x1="110" y1="4" x2="110" y2="30"/><line x1="150" y1="4" x2="150" y2="18"/><line x1="190" y1="4" x2="190" y2="30"/><line x1="230" y1="4" x2="230" y2="18"/><line x1="270" y1="4" x2="270" y2="30"/><line x1="310" y1="4" x2="310" y2="18"/><line x1="350" y1="4" x2="350" y2="30"/>
    </g>
    <g font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="18" font-weight="700" fill="#1f2937">
      <text x="22" y="48">10</text><text x="102" y="48">11</text><text x="182" y="48">12</text><text x="262" y="48">13</text><text x="342" y="48">14</text>
    </g>
  </g>

  <!-- 文字（左側） -->
  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif" fill="#1f2937">
    <text x="70" y="150" font-size="44" font-weight="800">長さと太さを入れるだけ</text>
    <text x="70" y="262" font-size="92" font-weight="900" letter-spacing="-2">ちんこ偏差値</text>
    <text x="70" y="366" font-size="92" font-weight="900" letter-spacing="-2">チェッカー</text>
    <text x="70" y="440" font-size="36" font-weight="700">日本人の平均と比べて</text>
    <text x="70" y="500" font-size="36" font-weight="700">偏差値と「100人中なん位」がわかる</text>
  </g>

  <!-- 吹き出し: 〇〇並み？ -->
  <g transform="translate(820 40)">
    <path d="M 20 0 H 360 Q 380 0 380 20 V 120 Q 380 140 360 140 H 150 L 120 172 L 126 140 H 20 Q 0 140 0 120 V 20 Q 0 0 20 0 Z" fill="#ffffff" stroke="#1f2937" stroke-width="6"/>
    <text x="190" y="52" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="30" font-weight="800" fill="#1f2937">あなたは</text>
    <text x="190" y="112" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="40" font-weight="900" fill="#e11d48">エクアドル人並み？！</text>
  </g>
  <!-- 下の帯 -->
  <rect x="0" y="566" width="1200" height="64" fill="#1f2937"/>
  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="28" font-weight="700" fill="#ffffff">
    <text x="70" y="609">登録不要・匿名・cmでもmmでもOK</text>
    <text x="1130" y="609" text-anchor="end">short-av.com</text>
  </g>
</svg>
