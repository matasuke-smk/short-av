<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- スマホの縦長画面（動画） -->
  <rect x="104" y="78" width="144" height="244" rx="26" fill="#f9fafb"/>
  <rect x="116" y="92" width="120" height="216" rx="16" fill="url(#screen)"/>
  <path d="M158 168 L202 196 L158 224 Z" fill="#ffffff"/>
  <path d="M176 276 L176 252 M164 262 L176 250 L188 262" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
  <!-- 右下に重ねた漫画（同人誌の試し読み）: 開いた本にコマ割りと吹き出し。左右スワイプの矢印 -->
  <g transform="translate(196 186)">
    <rect x="4" y="8" width="132" height="120" rx="12" fill="#111827" opacity="0.55"/>
    <rect x="0" y="0" width="132" height="120" rx="12" fill="url(#book)" stroke="#f9fafb" stroke-width="5"/>
    <!-- 左のページ: コマ割り -->
    <rect x="10" y="10" width="52" height="100" rx="4" fill="#ffffff"/>
    <path d="M10 44 H62 M10 74 L62 66 M36 10 V44" stroke="#111827" stroke-width="4"/>
    <!-- 右のページ: コマ割り -->
    <rect x="70" y="10" width="52" height="100" rx="4" fill="#ffffff"/>
    <path d="M70 52 H122 M96 52 V110" stroke="#111827" stroke-width="4"/>
    <!-- 吹き出し -->
    <ellipse cx="104" cy="30" rx="24" ry="17" fill="#ffffff" stroke="#111827" stroke-width="4"/>
    <path d="M90 43 L82 56 L98 45" fill="#ffffff" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
    <path d="M104 21 V32 M104 38 V39" stroke="#db2777" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- 左右スワイプの矢印 -->
  <path d="M226 318 L214 330 L226 342 M306 318 L318 330 L306 342" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
